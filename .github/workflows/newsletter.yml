name: AI Newsletter

on:
  schedule:
    # 04:30 / 16:30 UTC = 10:00 / 22:00 IST. GitHub's cron is best-effort and in
    # practice starts these runs 2-5 hours late; for on-time delivery, trigger the
    # workflow_dispatch below from an external scheduler (see README).
    - cron: "30 4,16 * * *"
  workflow_dispatch: {}

concurrency:
  group: newsletter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Gmail (used until Resend secrets are added)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Resend (empty until you add these secrets; provider stays on Gmail while blank)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          MAIL_UNSUBSCRIBE: ${{ secrets.MAIL_UNSUBSCRIBE }}
        run: python run_issue.py

      # Runs even if the pipeline step failed: once an email is out, its record
      # must reach the repo or the next run would resend the same stories.
      # newsletter.db is binary, so `git pull --rebase` can't merge it — instead,
      # re-apply this run's copy on top of the latest main and retry the push.
      - name: Save database back to the repo
        if: always()
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          cp newsletter.db "$RUNNER_TEMP/newsletter.db"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/newsletter.db" newsletter.db
            git add newsletter.db
            if git diff --cached --quiet; then
              echo "No database changes to save."
              exit 0
            fi
            git commit --quiet -m "chore: update newsletter.db [skip ci]"
            if git push --quiet origin HEAD:main; then
              echo "Database saved."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — retrying on top of the latest main."
            sleep $((attempt * 5))
          done
          echo "::error::Could not save newsletter.db — the next run may resend this issue's stories."
          exit 1
