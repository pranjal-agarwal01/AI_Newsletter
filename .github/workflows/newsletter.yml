name: AI Newsletter

on:
  schedule:
    # 04:30 / 16:30 UTC = 10:00 / 22:00 IST — 2 issues a day (10 AM and 10 PM IST).
    # GitHub cron is best-effort; runs can start a few minutes late.
    - cron: "30 4,16 * * *"
  workflow_dispatch: {}

concurrency:
  group: newsletter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Gmail (used until Resend secrets are added)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Resend (empty until you add these secrets; provider stays on Gmail while blank)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          MAIL_UNSUBSCRIBE: ${{ secrets.MAIL_UNSUBSCRIBE }}
        run: python run_issue.py

      - name: Save database back to the repo
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter.db
          if git diff --cached --quiet; then
            echo "No database changes to save."
          else
            git commit -m "chore: update newsletter.db [skip ci]"
            git pull --rebase origin main
            git push
          fi
