# News sources for the daily digest. Edit freely — each adapter reads its own section.

rss:
  feeds:
    # Anthropic publishes no RSS feed; their announcements arrive via HN + Simon Willison
    - name: Google DeepMind
      url: https://deepmind.google/blog/rss.xml
    - name: OpenAI Blog
      url: https://openai.com/news/rss.xml
    - name: Google AI Blog
      url: https://blog.google/technology/ai/rss/
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    - name: Simon Willison
      url: https://simonwillison.net/atom/everything/
  max_items_per_feed: 15

hackernews:
  max_stories: 60          # how many top stories to scan
  min_score: 80            # minimum HN points
  keywords:                # keep a story if title matches any whole word (case-insensitive)
    - "ai"
    - "llm"
    - "gpt"
    - "claude"
    - "gemini"
    - "openai"
    - "anthropic"
    - "machine learning"
    - "neural"
    - "transformer"
    - "agent"
    - "model"
    - "rag"
    - "embedding"

arxiv:
  categories: [cs.AI, cs.CL, cs.LG]
  max_results: 40

# How far back to consider UNSENT articles as candidates. Wider = fuller digests,
# because with 2 sends/day a short window is mostly already-sent articles and the
# unsent pool per run is tiny. 72h surfaces the never-sent backlog without feeling stale.
freshness_hours: 72

# Refuse to send a new issue if the previous one went out less than this many
# hours ago. The 2-a-day sends (10:00 and 22:00 IST) are 12h apart, so 8 blocks
# any accidental double while leaving room for GitHub cron jitter. --force overrides.
min_hours_between_issues: 8

# Maximum candidates passed to the model in one call
max_candidates: 30
